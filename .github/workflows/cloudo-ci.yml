name: CloudDO CI

on:
  pull_request:
    branches: [ main ]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_PREFIX: cloudo

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.diff.outputs.components }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Diff against the target branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$files"
          # CI/build changes rebuild everything.
          all=false
          if echo "$files" | grep -qE '^(\.github/workflows/cloudo-ci\.yml|Makefile)$'; then all=true; fi
          changed() { [ "$all" = true ] || echo "$files" | grep -q "^$1/"; }
          json="{"
          for pair in orchestrator:src/core/orchestrator worker:src/core/worker ui:src/core/cloudo-ui agent:src/core/agent; do
            name="${pair%%:*}"; path="${pair#*:}"
            if changed "$path"; then value=true; else value=false; fi
            json="${json}\"${name}\":${value},"
          done
          json="${json%,}}"
          echo "components=${json}" | tee -a "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
        node-version: [ "20.x" ]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pytest
          pip install -r src/core/orchestrator/requirements.txt

      - name: Check imports with isort
        run: isort --check-only --profile black .

      - name: Lint with flake8
        run: flake8 . --max-line-length=200

      - name: Run unit tests (orchestrator, worker, agent)
        run: make test

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: src/core/cloudo-ui/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: src/core/cloudo-ui

      - name: Lint Frontend
        run: npm run lint
        working-directory: src/core/cloudo-ui

      - name: Build Frontend
        run: npm run build
        working-directory: src/core/cloudo-ui

  build:
    name: Build & push ${{ matrix.component }}
    if: github.event_name == 'merge_group'
    needs: [ changes, check ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: orchestrator
            target: orchestrator
          - component: worker
            target: worker
          - component: ui
            target: fe
          - component: agent
            target: agent
    steps:
      - name: Skip unchanged component
        if: ${{ !fromJSON(needs.changes.outputs.components)[matrix.component] }}
        run: echo "${{ matrix.component }} unchanged, nothing to build"

      - name: Checkout
        if: ${{ fromJSON(needs.changes.outputs.components)[matrix.component] }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Login to GHCR
        if: ${{ fromJSON(needs.changes.outputs.components)[matrix.component] }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
        if: ${{ fromJSON(needs.changes.outputs.components)[matrix.component] }}
        run: |
          make build-${{ matrix.target }} DOCKER=docker REGISTRY="${REGISTRY}" IMAGE_PREFIX="${IMAGE_PREFIX}" PLATFORM="linux/amd64" VERSION="${{ github.sha }}"
          make push-${{ matrix.target }} DOCKER=docker REGISTRY="${REGISTRY}" IMAGE_PREFIX="${IMAGE_PREFIX}" PLATFORM="linux/amd64" VERSION="${{ github.sha }}"

  # Single, stable required status check for the ruleset (job names above vary
  # with the matrix; skipped jobs count as passed).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [ changes, check, build ]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) echo "A required job did not succeed"; exit 1 ;;
          esac
