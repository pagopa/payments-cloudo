{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudo-secrets
  namespace: {{ include "cloudo.namespace" . }}
  labels:
    {{- include "cloudo.labels" . | nindent 4 }}
type: Opaque
stringData:
  AzureWebJobsStorage: {{ .Values.secrets.azureWebJobsStorage | quote }}
  CLOUDO_SECRET_KEY: {{ .Values.secrets.cloudoSecretKey | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  APPROVAL_SECRET: {{ .Values.secrets.approvalSecret | quote }}
  SLACK_TOKEN_DEFAULT: {{ .Values.secrets.slackTokenDefault | quote }}
  SLACK_CHANNEL_DEFAULT: {{ .Values.secrets.slackChannelDefault | quote }}
  JSM_API_KEY_DEFAULT: {{ .Values.secrets.jsmApiKeyDefault | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  FUNCTION_KEY: {{ .Values.secrets.functionKey | quote }}
  AGENT_LLM_API_KEY: {{ .Values.secrets.agentLlmApiKey | quote }}
{{- end }}
